linetest_planner_node:
  ros__parameters:
    topics:
      centerline_topic: /planned_centerline
      cmd_topic: /cmd
      odom_topic: /sim/odom
    runtime:
      publish_rate_hz: 60.0
    control:
      controller_type: pure_pursuit
      stop_if_no_path: true
    stanley:
      k_gain: 2.2
      softening_speed_mps: 0.0
      heading_gain: 1.0
      lookahead_idx_offset: 0
      steering_limit_rad: 0.52
      steering_lowpass_alpha: 1.0
      steering_rate_limit_rad_s: 10.0
      use_yaw_rate_damping: true
      yaw_rate_damping_gain: 0.0
      wheelbase_m: 1.65
      cross_track_deadband_m: 0.0
    pure_pursuit:
      lookahead_m: 3.0
      min_lookahead_m: 1.5
      max_lookahead_m: 8.0
      lookahead_gain: 0.0
      steering_limit_rad: 0.52
      steering_lowpass_alpha: 1.0
      steering_rate_limit_rad_s: 10.0
      wheelbase_m: 1.65
    speed_control:
      speed_min_mps: 4.17
      speed_max_mps: 4.17
      curvature_speed_gain: 4.0
      lowpass_speed_alpha: 0.15
    diagnostics:
      topic: /linetest_planner/diagnostics
      publish_control_debug: true
      publish_thesis_context: false
    line:
      start_x_m: -38.5
      start_y_m: 0.0
      end_x_m: 50.0
      end_y_m: 0.0
      point_spacing_m: 0.5
