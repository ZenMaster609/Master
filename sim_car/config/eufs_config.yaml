inertia:
  m:        321.5   # Weight of the Vehicle [kg] (with driver)
  g:        9.81    # Gravity force         [m/s^2]
  I_z:      47.5    # Yaw inertia I_zz      [kg*m^2] (scaled by mass and wheelbase)

kinematics:
  l: 1.65           # Wheelbase              [m]
  b_F: 0.73552      # From COG to front axle [m] (with driver)
  b_R: 0.91448      # From COG to rear axle  [m] (with driver)
  w_front: 0.55423  # Percentage of weight front (with driver)
  axle_width: 1.069 # Track width            [m]

tire:
  tire_coefficient: 1.0
  B: 12.56
  C: -1.38
  D: 1.60
  E: -0.58
  radius: 0.23

aero:
  C_Down: 1.9 # F_Downforce = C_Downforce*v_x^2
  C_drag: 1   # F_Drag = C_Drag*v_x^2

dynamics:
  update_rate_hz: 50.0
  control_delay_sec: 0.0
  kinematic_blend_start_mps: 3.5
  kinematic_blend_end_mps: 7.0

control:
  max_speed: 75.0           # m/s
  accel_limit: 12.5         # m/s^2
  brake_decel_limit: 25.0   # m/s^2

input_ranges:
  acceleration:
    max: 9.26   # m/s^2 (0-100 km/h in 3.0 s)
    min: -5
  velocity:
    max: 41.67  # m/s (150 km/h)
    min: 0
  steering:
    max: 0.52   # radians (≈30 deg, matches steering joint limit)
    min: -0.52  # radians (≈-30 deg)
