pair_midpoint_planner_node:
  ros__parameters:
    topics:
      cones_topic: "sim/stereo/perception/cones_3d"
      odom_topic: "sim/odom"
      cmd_topic: "/cmd"
      path_topic: "sim/planner/pair_midpoint_path"
      markers_topic: "sim/planner/pair_midpoint_markers"

    gating:
      min_confidence: 0.35
      x_min_m: 0.5
      x_max_m: 8.0
      y_abs_max_m: 8.0
      max_cone_age_s: 20.0
      hold_last_valid_s: 2.0
      startup_delay_s: 0.0

    colors:
      left_boundary: ["blue"]
      right_boundary: ["yellow"]
      split_unmapped_by_y_sign: true

    pairing:
      max_pair_dx_m: 4.0
      max_pair_dist_m: 5.5
      min_pairs_required: 2
      allow_unbalanced_sides: true
      pair_by: "greedy_x"
      reuse_unpaired_for_tail: false  # Declared for future use; v1 does not synthesize a tail from unpaired cones.

    path_generation:
      preview_horizon_m: 9.0
      control_horizon_m: 5.5
      sample_count: 21  # Reserved for future resampling; v1 uses midpoint ordering directly.
      smoothing_window: 3
      enforce_monotonic_x: true

    pure_pursuit:
      lookahead_min_m: 3.0
      lookahead_gain: 0.35
      steering_limit_rad: 0.32
      wheelbase_m: 1.6
      stop_if_no_path: false

    wall_avoidance:
      enabled: false
      min_clearance_m: 0.3
      steering_gain_rad_per_m: 5.0
      lookahead_margin_m: 0.7

    one_sided_bias:
      enabled: false
      increment_rad_per_frame: 0.003
      max_bias_rad: 0.12

    speed_control:
      speed_min_mps: 1.0
      speed_max_mps: 1.8
      curvature_speed_gain: 4.0
      lowpass_speed_alpha: 0.15

    debug:
      publish_path: true
      publish_markers: true
      show_counts_in_status: true
      log_throttle_s: 1.0

    frames:
      base_frame: "base_footprint"
      tf_timeout_s: 0.02

    cone_axes:
      forward_axis: "x"
      lateral_axis: "y"
      forward_sign: 1.0
      lateral_sign: 1.0

    planner_rate_hz: 30.0
