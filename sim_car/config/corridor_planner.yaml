corridor_planner_node:
  ros__parameters:
    frames:
      planning_frame: "odom"
      odom_frame: "odom"
      base_frame: "front_axle"
      tf_timeout_s: 0.03

    topics:
      tracked_cones_topic: "/tracked_cones"
      cmd_topic: "/cmd"
      centerline_topic: "/planned_centerline"
      viz_topic: "/planner_viz"
      points_topic: "/planned_centerline_points"
      odom_topic: "/sim/odom"

    filtering:
      max_cone_range_m: 25.0
      planning_horizon_m: 25.0
      max_lateral_range_m: 8.0
      behind_drop_m: 5.0
      min_confidence: 0.3
      min_required_cones: 4
      infer_unknown_by_side: true
      infer_orange_by_side: true
      orange_min_lateral_m: 0.9
      orange_neighbor_radius_m: 3.5
      orange_neighbor_margin_m: 0.75

    boundary_chain:
      min_step_m: 0.8
      max_step_m: 5.5
      max_heading_change_rad: 0.95
      min_forward_progress_m: 0.2
      min_chain_length: 3

    width_estimation:
      initial_width_m: 3.6
      min_width_m: 2.4
      max_width_m: 4.8
      alpha: 0.18
      max_delta_per_update_m: 0.2
      min_trustworthy_pairs: 3

    corridor:
      min_corridor_width_m: 2.2
      max_corridor_width_m: 5.4
      boundary_resample_dx: 0.5
      min_required_corridor_samples: 5
      path_fit_smoothing_window: 5
      membership_margin_m: 0.15

    centerline:
      path_resolution_m: 0.5
      max_path_length_m: 30.0
      temporal_alpha: 0.25

    midline_memory:
      horizon_m: 30.0
      station_spacing_m: 0.5
      near_distance_m: 4.0
      mid_distance_m: 12.0
      control_handoff_distance_m: 1.5
      near_alpha: 0.06
      mid_alpha: 0.18
      far_alpha: 0.35
      near_max_lateral_shift_m: 0.10
      mid_max_lateral_shift_m: 0.20
      far_max_lateral_shift_m: 0.40
      hold_last_valid_duration_s: 2.5
      min_buffer_confidence: 0.20
      pair_memory_retention_s: 12.0

    runtime:
      publish_rate_hz: 180.0
      log_throttle_s: 1.0

    speed_control:
      speed_min_mps: 1.0
      speed_max_mps: 4.0
      curvature_speed_gain: 4.0
      lowpass_speed_alpha: 0.15

    validation:
      min_path_points: 4
      min_forward_extent_m: 2.0
      jump_check_horizon_m: 8.0
      max_near_field_lateral_jump_m: 0.6
      max_heading_delta_rad: 0.75
      max_initial_heading_error_rad: 1.0
      max_curvature: 0.45
      hold_last_valid_s: 2.5
      hold_exit_clean_frames: 2
      candidate_jump_reject_threshold_m: 1.0
      candidate_jump_recover_frames: 3
      candidate_min_points: 4
      candidate_min_extent_m: 2.0

    diagnostics:
      topic: "/corridor_planner/diagnostics"
      centerline_jump_horizon_m: 8.0
      edge_quantization_m: 0.05
      jump_warn_threshold_m: 0.8
      edge_churn_warn_threshold: 0.4
      publish_control_debug: true
      publish_thesis_context: false

    debug:
      enable_markers: true
      show_raw_cones: true
      show_boundary_chains: true
      show_pair_lines: true
      show_raw_midpoint_chain: true
      show_raw_prevalidation_centerline: true
      publish_points_topic: false
      show_lookahead_point: true
