skidpad_router_node:
  ros__parameters:
    frames:
      odom_frame: "odom"
      base_frame_aliases: ["front_axle", "base_link", "base_footprint"]

    topics:
      input_topic: "/tracked_cones"
      output_topic: "/tracked_cones/skidpad_routed"
      odom_topic: "/sim/odom"
      cmd_topic: "/cmd"
      diagnostics_topic: "/skidpad_router/diagnostics"
      viz_topic: "/skidpad_router/markers"

    geometry:
      crossroads_center_xy: [0.0, 0.0]
      crossroads_half_extents_xy: [3.0, 2.5]
      left_circle_center_xy: [-9.25, 0.0]
      right_circle_center_xy: [9.25, 0.0]
      circle_radius_window_m: [6.5, 11.5]

    routing:
      event_mode: "skidpad"
      route_sequence: ["right", "right", "left", "left", "straight"]
      lap_complete_angle_rad: 5.5
      lobe_radius_m: 12.5
      right_lobe_min_x_m: -1.0
      left_lobe_max_x_m: 1.0
      straight_corridor_half_width_m: 2.0
      straight_min_y_m: -1.0

    parking:
      corridor_half_width_m: 2.0
      start_y_m: 8.5
      parked_speed_threshold_mps: 0.5
      parked_hold_time_s: 1.0
      test_park_only: true
      acceleration_activation_distance_m: 10.0
      stop_margin_m: 1.0
      stop_line_cluster_depth_m: 2.5
      stop_line_min_lateral_span_m: 1.0
      stop_line_min_cluster_count: 4
      stop_line_min_points_per_side: 1
      stop_override_publish_rate_hz: 50.0

    synthetic:
      pair_half_width_m: 1.6375
      pair_y_m: [3.5, 5.5, 7.5]
