delaunay_planner_node:
  ros__parameters:
    frames:
      planning_frame: "odom"
      odom_frame: "odom"
      base_frame: "front_axle"
      tf_timeout_s: 0.03

    topics:
      tracked_cones_topic: "/tracked_cones"
      cmd_topic: "/cmd"
      centerline_topic: "/planned_centerline"
      viz_topic: "/planner_viz"
      points_topic: "/planned_centerline_points"
      odom_topic: "/sim/odom"

    filtering:
      max_cone_range_m: 25.0
      behind_drop_m: 5.0
      min_confidence: 0.3
      use_unknown_cones: true
      infer_unknown_by_side: true
      infer_orange_by_side: true
      include_orange: false
      orange_min_lateral_m: 0.9
      orange_neighbor_radius_m: 3.5
      orange_neighbor_margin_m: 0.75
      min_colored_cones: 4
      min_required_cones: 4

    edge_selection:
      min_cross_edge_m: 0.8
      max_cross_edge_m: 6.0  # small_track spawn has valid local cross-track pairs above 5 m
      cross_edge_lateral_ratio: 0.6
      min_cross_edges: 3
      max_near_field_lateral_jump_m: 0.6
      near_field_midpoint_count: 5
      max_diagonal_forward_alignment: 0.55
      max_width_prior_step_drift_m: 0.2
      max_midpoint_kink_rad: 1.2
      max_seed_midpoint_distance_m: 8.0
      max_same_side_step_m: 5.0
      min_midpoint_progress_m: 0.15
      width_prior_tolerance_m: 1.0
      temporal_midpoint_match_tolerance_m: 1.0
      local_opposite_neighbor_count: 1
      local_opposite_forward_sector_rad: 0.9

    centerline:
      min_spacing_m: 0.5
      path_resolution_m: 0.5
      max_path_length_m: 30.0
      enable_temporal_smoothing: true
      smoothing_alpha: 0.15
      enable_near_field_freeze: true
      freeze_near_field_m: 3.0
      freeze_blend_length_m: 1.0
      enable_committed_near_field: true
      commit_plan_horizon_m: 8.0
      commit_stable_frames: 3
      commit_update_max_churn_ratio: 0.45

    runtime:
      publish_rate_hz: 180.0
      log_throttle_s: 1.0

    speed_control:
      speed_min_mps: 1.0
      speed_max_mps: 4.0
      curvature_speed_gain: 4.0
      lowpass_speed_alpha: 0.15

    validation:
      hold_last_valid_s: 1.5
      hold_exit_clean_frames: 2

    diagnostics:
      topic: "/delaunay_planner/diagnostics"
      centerline_jump_horizon_m: 8.0
      edge_quantization_m: 0.05
      jump_warn_threshold_m: 0.8
      edge_churn_warn_threshold: 0.4
      publish_control_debug: true
      publish_thesis_context: false

    debug:
      enable_markers: true
      show_raw_cones: true
      show_delaunay_edges: false
      show_candidate_edges: true
      show_selected_edges: true
      show_raw_midpoint_chain: true
      show_raw_prevalidation_centerline: true
      publish_points_topic: false
      show_lookahead_point: true
