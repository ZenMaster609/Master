seed: 12345
signals:
  imu:
    enabled: true
    input_topic: /sim/raw/imu
    output_topic: /sim/imu
    msg_type: sensor_msgs/msg/Imu
    rate_hz: 50.0
    latency_ms: 0.0
    dropout_prob: 0.0
    noise_std:
      angular_velocity: 0.0
      linear_acceleration: 0.0
    bias_init:
      angular_velocity: 0.0
      linear_acceleration: 0.0
    bias_rw_std:
      angular_velocity: 0.0
      linear_acceleration: 0.0
    saturation_min:
      angular_velocity: -20.0
      linear_acceleration: -50.0
    saturation_max:
      angular_velocity: 20.0
      linear_acceleration: 50.0

  imu_velocity:
    enabled: true
    plot_only: true
    output_topic: /sim/imu

  imu_yaw:
    enabled: true
    plot_only: true
    output_topic: /sim/imu

  navsat:
    enabled: true
    input_topic: /sim/raw/navsat
    output_topic: /sim/navsat
    msg_type: sensor_msgs/msg/NavSatFix
    rate_hz: 5.0
    latency_ms: 0.0
    dropout_prob: 0.0
    noise_std:
      latitude: 0.0
      longitude: 0.0
      altitude: 0.0
    bias_init:
      latitude: 0.0
      longitude: 0.0
      altitude: 0.0
    bias_rw_std:
      latitude: 0.0
      longitude: 0.0
      altitude: 0.0
    saturation_min:
      latitude: -90.0
      longitude: -180.0
      altitude: -1000.0
    saturation_max:
      latitude: 90.0
      longitude: 180.0
      altitude: 10000.0

  gnss_position:
    enabled: true
    plot_only: true
    output_topic: /sim/navsat

  odom:
    enabled: true
    input_topic: /sim/raw/odom
    output_topic: /sim/odom
    msg_type: nav_msgs/msg/Odometry
    rate_hz: 50.0
    latency_ms: 0.0
    dropout_prob: 0.0
    noise_std: 0.0
    bias_init: 0.0
    bias_rw_std: 0.0
    saturation_min: null
    saturation_max: null
    apply_orientation: false

  odom_position:
    enabled: true
    plot_only: true
    output_topic: /sim/odom

  odom_velocity:
    enabled: true
    plot_only: true
    output_topic: /sim/odom

  odom_yaw:
    enabled: true
    plot_only: true
    output_topic: /sim/odom

  wheel_encoder_rpm:
    enabled: false
    input_topic: /sim/raw/wheel_encoder/rpm
    output_topic: /sim/wheel_encoder/rpm
    msg_type: std_msgs/msg/Float32MultiArray
    rate_hz: 50.0
    latency_ms: 0.0
    dropout_prob: 0.0
    noise_std: 0.0
    bias_init: 0.0
    bias_rw_std: 0.0
    saturation_min: -5000.0
    saturation_max: 5000.0

  wheel_encoder_angle_accum:
