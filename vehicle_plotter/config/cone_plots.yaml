# Cone depth validation plots for vehicle_plotter.
#
# Input topic publishes CSV rows in std_msgs/String:
# cone_id,color,samples,axis_mae_m,axis_rmse_m,dcam,dgt

window:
  title: "Cone Depth Validation"
  width: 2200
  height: 950
  dark_mode: true
  update_rate_hz: 15.0

layout:
  rows: 2
  cols: 5
  buffer_size: 900

settings:
  cone_topic: "/sim/stereo/eval/cone_depth_per_cone"
  top_cone_count: 4
  total_average_stride: 15

plots:
  - name: "cone_1"
    type: "timeseries"
    row: 0
    col: 0
    x_axis_type: "time"
    y_axis:
      label: "Value"
      unit: "m"
      limits: [0.0, 20.0]
      auto_scale: false
    series:
      - name: "RMSE_x"
        variable: "cone_1_rmse_x"
        color: "#d62728"
      - name: "RMSE_y"
        variable: "cone_1_rmse_y"
        color: "#1f77b4"
      - name: "GT_distance"
        variable: "cone_1_dgt"
        color: "#ff7f0e"

  - name: "cone_2"
    type: "timeseries"
    row: 0
    col: 1
    x_axis_type: "time"
    y_axis:
      label: "Value"
      unit: "m"
      limits: [0.0, 20.0]
      auto_scale: false
    series:
      - name: "RMSE_x"
        variable: "cone_2_rmse_x"
        color: "#d62728"
      - name: "RMSE_y"
        variable: "cone_2_rmse_y"
        color: "#1f77b4"
      - name: "GT_distance"
        variable: "cone_2_dgt"
        color: "#ff7f0e"

  - name: "cone_3"
    type: "timeseries"
    row: 0
    col: 2
    x_axis_type: "time"
    y_axis:
      label: "Value"
      unit: "m"
      limits: [0.0, 20.0]
      auto_scale: false
    series:
      - name: "RMSE_x"
        variable: "cone_3_rmse_x"
        color: "#d62728"
      - name: "RMSE_y"
        variable: "cone_3_rmse_y"
        color: "#1f77b4"
      - name: "GT_distance"
        variable: "cone_3_dgt"
        color: "#ff7f0e"

  - name: "cone_4"
    type: "timeseries"
    row: 0
    col: 3
    x_axis_type: "time"
    y_axis:
      label: "Value"
      unit: "m"
      limits: [0.0, 20.0]
      auto_scale: false
    series:
      - name: "RMSE_x"
        variable: "cone_4_rmse_x"
        color: "#d62728"
      - name: "RMSE_y"
        variable: "cone_4_rmse_y"
        color: "#1f77b4"
      - name: "GT_distance"
        variable: "cone_4_dgt"
        color: "#ff7f0e"

  - name: "average_now"
    type: "timeseries"
    row: 0
    col: 4
    x_axis_type: "time"
    y_axis:
      label: "Error"
      unit: "m"
    series:
      - name: "Axis RMSE"
        variable: "cone_depth_axis_rmse_m"
        color: "#d62728"
      - name: "Axis MAE"
        variable: "cone_depth_axis_mae_m"
        color: "#1f77b4"
      - name: "Range RMSE"
        variable: "cone_depth_range_rmse_m"
        color: "#9467bd"
      - name: "Range MAE"
        variable: "cone_depth_range_mae_m"
        color: "#17becf"

  - name: "cone_1_distance"
    type: "timeseries"
    row: 1
    col: 0
    x_axis_type: "time"
    y_axis:
      label: "Distance"
      unit: "m"
      limits: [0.0, 20.0]
      auto_scale: false
    series:
      - name: "predicted_distance"
        variable: "cone_1_dcam"
        color: "#2ca02c"
      - name: "GT_distance"
        variable: "cone_1_dgt"
        color: "#ff7f0e"

  - name: "cone_2_distance"
    type: "timeseries"
    row: 1
    col: 1
    x_axis_type: "time"
    y_axis:
      label: "Distance"
      unit: "m"
      limits: [0.0, 20.0]
      auto_scale: false
    series:
      - name: "predicted_distance"
        variable: "cone_2_dcam"
        color: "#2ca02c"
      - name: "GT_distance"
        variable: "cone_2_dgt"
        color: "#ff7f0e"

  - name: "cone_3_distance"
    type: "timeseries"
    row: 1
    col: 2
    x_axis_type: "time"
    y_axis:
      label: "Distance"
      unit: "m"
      limits: [0.0, 20.0]
      auto_scale: false
    series:
      - name: "predicted_distance"
        variable: "cone_3_dcam"
        color: "#2ca02c"
      - name: "GT_distance"
        variable: "cone_3_dgt"
        color: "#ff7f0e"

  - name: "cone_4_distance"
    type: "timeseries"
    row: 1
    col: 3
    x_axis_type: "time"
    y_axis:
      label: "Distance"
      unit: "m"
      limits: [0.0, 20.0]
      auto_scale: false
    series:
      - name: "predicted_distance"
        variable: "cone_4_dcam"
        color: "#2ca02c"
      - name: "GT_distance"
        variable: "cone_4_dgt"
        color: "#ff7f0e"

  - name: "average_total"
    type: "timeseries"
    row: 1
    col: 4
    x_axis_type: "time"
    y_axis:
      label: "Aux"
      unit: ""
    series:
      - name: "Axis Bias (m)"
        variable: "cone_depth_axis_bias_m"
        color: "#8c564b"
      - name: "Sync dt (ms)"
        variable: "cone_depth_sync_dt_ms"
        color: "#7f7f7f"
      - name: "Pairs"
        variable: "cone_depth_pairs"
        color: "#bcbd22"
