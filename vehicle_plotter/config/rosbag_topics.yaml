# Rosbag recording topic configuration
#
# Defines which topics to record for different operational modes.
# Used by rosbag_controller_node to select topics for recording.

# Common topics recorded in all modes
common:
  - /vehicle_plotter/state
  - /run_session

# Simulation topics (Gazebo)
simulation:
  - /imu
  - /navsat
  - /odom
  - /wheel_encoder/rpm
  - /cmd_vel
  - /joint_states
  - /clock

# Remote plotter topics (subscriber side)
windows_plotter:
  - /vehicle_plotter/state
  - /run_session

# Minimal recording (state only)
minimal:
  - /vehicle_plotter/state
