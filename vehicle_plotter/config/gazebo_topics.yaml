# Topic mappings for Gazebo Fortress simulation
#
# These are the default topic names used by the Gazebo adapter.
# Remap these if your simulation uses different topic names.

adapter: gazebo

topics:
  # IMU data from Gazebo via ros_gz_bridge
  # Note: ros_gz_bridge publishes to /imu (not /imu/data)
  imu: /imu

  # GPS/NavSat data from Gazebo via ros_gz_bridge
  # Note: ros_gz_bridge publishes to /navsat (not /gps/fix)
  gps: /navsat

  # Odometry from Gazebo differential drive plugin
  odom: /odom

  # Wheel encoder ticks (from wheel_encoder_node)
  encoder_ticks: /wheel_encoder/ticks

  # Wheel encoder velocities (from wheel_encoder_node)
  encoder_velocities: /wheel_encoder/velocities

  # Command velocity (for reference)
  cmd_vel: /cmd_vel

# Sensor rates (Hz) - used for time synchronization
sensor_rates:
  imu: 100.0
  gps: 5.0
  odom: 50.0
  encoder_ticks: 50.0
  encoder_velocities: 50.0

# GPS origin (set to 0,0 for auto-detection from first GPS message)
gps_origin:
  latitude: 0.0
  longitude: 0.0
  altitude: 0.0
  auto_detect: true
