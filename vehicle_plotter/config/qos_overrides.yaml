# QoS overrides for rosbag2 recording
#
# Use this file when recording topics with rosbag2:
#   ros2 bag record --qos-profile-overrides-path qos_overrides.yaml \
#       /imu/data /gps/fix /odom /wheel_encoder/velocities /vehicle_plotter/state

# High-rate sensor topics - use best_effort to avoid backpressure
/imu/data:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 10

/odom:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 10

/wheel_encoder/velocities:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 10

# GPS - reliable to avoid missing samples
/gps/fix:
  reliability: reliable
  durability: volatile
  history: keep_last
  depth: 50

# Vehicle plotter state - reliable with transient local for late joiners
/vehicle_plotter/state:
  reliability: reliable
  durability: transient_local
  history: keep_last
  depth: 100
