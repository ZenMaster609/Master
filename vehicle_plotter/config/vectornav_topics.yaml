# Topic mappings for VectorNav VN-200 Rugged IMU/GPS
#
# These topics are published by the vectornav ROS 2 driver.
# See: https://github.com/dawonn/vectornav

adapter: vectornav

topics:
  # VN-200 IMU data (400 Hz capable)
  imu: /vectornav/imu

  # VN-200 GPS data
  gps: /vectornav/gps

  # VN-200 INS solution (fused IMU+GPS)
  ins: /vectornav/ins

  # Wheel encoder speeds in RPM (from CAN interface)
  encoder_velocities: /wheel_encoder/rpm

  # Command velocity
  cmd_vel: /cmd_vel

# Sensor rates (Hz) for VN-200
# Note: VN-200 can output up to 400 Hz, but 100-200 Hz is typical
sensor_rates:
  imu: 200.0
  gps: 5.0
  ins: 200.0
  encoder_velocities: 100.0

# GPS origin for local coordinate conversion
# Set latitude/longitude to your test location origin
gps_origin:
  latitude: 0.0   # Set to your origin latitude
  longitude: 0.0  # Set to your origin longitude
  altitude: 0.0
  auto_detect: true  # Auto-set from first GPS fix if lat/lon are 0

# VN-200 specific settings
vectornav:
  # Use INS solution for position/velocity if available
  prefer_ins: true

  # Coordinate frame for INS output
  frame_id: base_link

  # Apply lever arm compensation (offset from IMU to vehicle CG)
  lever_arm:
    x: 0.0
    y: 0.0
    z: 0.0
