# VectorNav VN-200 High-Rate IMU Configuration
# Optimized for 400 Hz IMU-only output (minimal latency)

# Serial port settings
serial:
  port: /dev/ttyUSB0
  baudrate: 921600
  timeout_sec: 0.05         # Faster timeout for high-rate

# Output rate configuration
output:
  rate_divisor: 2           # 800/2 = 400 Hz output rate
  async_mode: 2

# Binary output - IMU focus only
binary_output_1:
  enabled: true

  # Common group with essential data
  group_common:
    enabled: true
    fields:
      - TimeStartup
      - AngularRate
      - Accel

  group_time:
    enabled: false
    fields: []

  # Full IMU data
  group_imu:
    enabled: true
    fields:
      - UncompAccel
      - UncompGyro

  # GPS disabled for lower bandwidth
  group_gps:
    enabled: false
    fields: []

  group_attitude:
    enabled: false
    fields: []

  # INS disabled for lower bandwidth
  group_ins:
    enabled: false
    fields: []

topics:
  imu: /vectornav/imu
  gps: /vectornav/gps
  ins: /vectornav/ins

frame_id: vectornav

diagnostics:
  publish_rate_hz: 1.0
  stale_timeout_ms: 25      # Tighter timeout for high-rate
